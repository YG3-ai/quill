[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quill-mcp"
version = "0.1.1"
description = "A free open-source thinking partner for coding agents — mediates dialogue between Claude Code, Codex CLI, Cursor, Cline, and more via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jacqueline Carter" },
    { name = "Sam Knox" },
    { name = "Partha Unnava" },
]
maintainers = [
    { name = "YG3", email = "help@yg3.ai" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "codex",
    "coding-agent",
    "ai",
    "thinking-partner",
    "agent-collaboration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Extra deps needed only by the Claude Code plugin's FastAPI bridge
# (not needed for the standalone MCP server). Install with:
#   pip install "quill-mcp[plugin]"
plugin = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "markdown>=3.5",
    "bleach>=6.0",
]

[project.scripts]
quill-mcp = "quill_mcp.server:run"

[project.urls]
Homepage = "https://github.com/YG3-ai/quill"
Repository = "https://github.com/YG3-ai/quill"
Issues = "https://github.com/YG3-ai/quill/issues"
Donate = "https://buy.stripe.com/5kQfZh5V30oabyO6ncb7y0i"

[tool.setuptools.packages.find]
where = ["src"]
